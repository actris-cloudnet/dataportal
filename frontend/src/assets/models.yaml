arpege:
  description: |
    ARPEGE (Action de Recherche Petite Echelle Grande Echelle) is a global
    spectral numerical weather prediction model with variable horizontal
    resolution, with the highest resolution (approximately 5 km) focused over
    Europe and gradually coarsening to about 25 km over more distant regions.
    Forecast data are provided by Météo-France.

    ECMWF runs the same model under the name <a href="/model/ecmwf">IFS</a> and
    provides data for most Cloudnet sites.
  domain: Global
  horizontalResolution: 5–25 km
  verticalResolution: 105 model levels
  timeResolution: 1 hour
  runs: Every 12 hours
  forecast: Up to 78 hours
  links:
    - <a href="https://meteofrance.com/meteo-a-z/les-modeles-de-prevision-meteo">Météo-France forecast models</a> (in French)
    - <a href="https://www.umr-cnrm.fr/gmapdoc/spip.php?article29">ARPEGE documentation</a>

icon-d2:
  description: |
    ICON-D2 is a short-term, high-resolution forecast model for Germany and the
    neighboring countries based on the ICON (Icosahedral Nonhydrostatic) model.
    The data are provided by the German Meteorological Service (DWD).
  domain: Central Europe
  horizontalResolution: 2.2 km
  verticalResolution: 65 model levels
  timeResolution: 15 minutes
  runs: Every 3 hours
  forecast: Up to 24 hours
  links:
