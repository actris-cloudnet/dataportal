ecmwf:
  description: |
    Integrated Forecasting System (IFS) is a global numerical weather prediction
    model provided by the European Centre for Medium-Range Weather Forecasts
    (ECMWF). ECMWF IFS is used as the primary model for Cloudnet processing
    across all measurement sites.

    Météo-France runs the same model under the name <a
    href="/model/arpege">ARPEGE</a> and provides data for select Cloudnet sites.
    For real-time processing, there is also an <a href="/model/ecmwf-open">ECMWF
    open data</a> version with reduced resolution and a limited set of parameters.

  domain: Global
  horizontalResolution: 9 km
  verticalResolution: 137 model levels
  timeResolution: 1 hour
  runs: Every 6 hours
  forecast: Up to 35 hours
  links:
    - <a href="https://www.ecmwf.int/en/forecasts/documentation-and-support/changes-ecmwf-model">ECMWF IFS documentation</a>

ecmwf-open:
  description: |
    Open data subset of the Integrated Forecasting System (IFS) is provided by
    European Centre for Medium-Range Weather Forecasts (ECMWF). Compared to <a
    href="/model/ecmwf">the full model</a>, the open data subset has reduced
    resolution and a limited number of parameters, but the forecast data are
    available up to three days in the future, which is used as a fallback for
    the real-time Cloudnet processing.
  domain: Global
  horizontalResolution: 0.25 degrees
  verticalResolution: 14 pressure levels from 1000 to 10 hPa
  timeResolution: 3 hours
  runs: Every 6 hours
  forecast: Up to 90 hours
  links:
    - <a href="https://www.ecmwf.int/en/forecasts/datasets/open-data">ECMWF open data</a>

arome:
  description: |
    AROME (Application of Research to Operations at Mesoscale) is a
    high-resolution, non-hydrostatic convection-permitting mesoscale numerical
    weather prediction model. The data are provided by Météo-France.
  domain: Central Europe
  horizontalResolution: 1.3 km
  verticalResolution: 90 model levels
  timeResolution: 1 hour
  runs: Every 12 hours
  forecast: Up to 36 hours
  links:
    - <a href="https://meteofrance.com/meteo-a-z/les-modeles-de-prevision-meteo">Météo-France forecast models</a> (in French)
    - <a href="https://www.umr-cnrm.fr/gmapdoc/spip.php?article29">AROME documentation</a>

arome-arctic:
  description: |
    AROME-Arctic is a regional adaptation of the <a href="/model/arome">AROME
    model</a> specifically configured for the Arctic region. The data are
