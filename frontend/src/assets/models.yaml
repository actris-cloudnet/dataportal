gdas1:
  description: |
    Global Data Assimilation System (GDAS) incorporates observations for the
    Global Forecasting System (GFS) of the National Oceanic and Atmospheric
    Administration (NOAA). GDAS analysis data can be used for Cloudnet
    processing if no other model data are available.

    This product is based on Air Resources Laboratory's (ARL) data archive where
    the original GDAS data are interpolated onto pressure levels and gridded to
    1-degree resolution.
  domain: Global
  horizontalResolution: 1 degree
  verticalResolution: 23 pressure levels from 20 to 1000 hPa
  timeResolution: 3 hours
  runs: Every 6 hours
  forecast: Up to 3 hours
  links:
    - <a href="https://www.ready.noaa.gov/gdas1.php">GDAS data archive</a>
