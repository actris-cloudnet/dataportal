        This variable has been corrected for attenuation by gaseous attenuation,
        and possibly liquid water, rain and melting layer (see quality_bits
        variable). Calibration convention: in the absence of attenuation, a cloud
        at 273 K containing one million 100-micron droplets per cubic metre will
        have a reflectivity of 0 dBZ at all frequencies.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Radar reflectivity factor
      name: Z
      standard_name: null
      units: dBZ
    - comment: |-
        This variable is an estimate of the one-standard-deviation
        calibration error.
      definition: null
      dimensions: []
      dtype: float32
      long_name: Bias in radar reflectivity factor
      name: Z_bias
      standard_name: null
      units: dB
    - comment: |-
        This variable is an estimate of the one-standard-deviation random error
        in radar reflectivity factor. It originates from the following independent
        sources of error:
        1) Precision in reflectivity estimate due to finite signal to noise and
           finite number of pulses
        2) 10% uncertainty in gaseous attenuation correction (mainly due to error
           in model humidity field)
        3) 20% uncertainty in rain attenuation correction (mainly due to error
           in disdrometer rainfall rate)
        4) 10%-20% uncertainty in melting layer attenuation correction (mainly due
           to error in disdrometer rainfall rate)
        5) Error in liquid water path (given by the variable lwp_error) and its
           partitioning with height).
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Error in radar reflectivity factor
      name: Z_error
      standard_name: null
      units: dB
    - comment: |-
        This variable is an estimate of the radar sensitivity, i.e. the minimum
        detectable radar reflectivity, as a function of height. It includes the
        effect of ground clutter and gas attenuation but not other attenuations.
      definition: null
      dimensions:
