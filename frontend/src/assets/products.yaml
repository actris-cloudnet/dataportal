epsilon-radar:
  common_variables:
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: |-
        This variable was calculated for profiles where 5 minutes of
        continuous cloud radar Doppler velocity was available. With less
        than 10% missing data, the missing values were filled by cubic
        spline interpolation.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Dissipation rate of turbulent kinetic energy
      name: epsilon
      standard_name: null
      units: m2 s-3
    - comment: |-
        Random uncertainty estimated as the standard deviation of epsilon
        across the frequency bands accepted by the inertial-subrange
        slope criterion (Griesche et al. 2020). It captures the scatter
        introduced by the multi-band fit but does not include systematic
        contributions from horizontal wind uncertainty or the Kolmogorov
        constant. The variable is masked where only a single band passed
        the slope filter and no spread can be estimated.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Absolute error in dissipation rate of turbulent kinetic energy
      name: epsilon_error
      standard_name: null
      units: m2 s-3
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
  description: "This product contains the dissipation rate of turbulent\n        kinetic\
    \ energy (\U0001D700) calculated using the pipeline of Griesche et al.\n     \
    \   (2020) with the inertial-subrange slope-acceptance criterion of Borque\n \
    \       et al. (2016). The turbulent energy spectrum is derived as the power\n\
    \        spectrum of cloud radar Doppler velocity over 5-minute windows and\n\
    \        converted to a wavenumber spectrum using model horizontal wind via\n\
    \        Taylor's hypothesis."
  dimensions:
    - comment: null
      definition: null
      dimensions:
