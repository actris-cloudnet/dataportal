der:
  common_variables:
    - comment: |-
        From scaled Frisch method the cloud droplet number concentration
        can be derived.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Cloud droplet number concentration
      name: N_scaled
      standard_name: number_concentration_of_cloud_liquid_water_particles_in_air
      units: m-3
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: |-
        This variable was calculated for the profiles where the categorization
        data has diagnosed that liquid water is present. The cloud droplet
        effective radius is calculated using the method 1 of Frisch et al.
        (2002), relating Z with effective radius by assuming a lognormal size
        distribution and its width and the number concentration of the cloud
        droplets.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Droplet effective radius
      name: der
      standard_name: effective_radius_of_cloud_liquid_water_particles
      units: m
    - comment: |-
        This variable is an estimate of the random error in effective
        radius assuming an error in Z of dZ = 2.0 dBZ, in N of
        dN = 200000000.0 m-3, and in the spectral width of dsigma_x = 0.1.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Absolute error in droplet effective radius
      name: der_error
      standard_name: null
      units: m
    - comment: null
      definition:
        - description: "No data: No cloud observed."
          label: Value 0
        - description: Reliable retrieval.
          label: Value 1
        - description: "Mix of drops and ice: Droplets and ice crystals coexist within
            pixel. Z may be biased by large crystals."
          label: Value 2
        - description: "Precipitation in profile: Drizzle and rain affects LWP retrieval
            of MWR but also the target reflectivity."
          label: Value 3
        - description: "Surrounding ice: Less crucial! Ice crystals in the vicinity of
            a droplet pixel may also bias its reflectivity."
          label: Value 4
      dimensions:
        - time
        - height
      dtype: int32
      long_name: Droplet effective radius retrieval status
      name: der_retrieval_status
      standard_name: null
      units: "1"
    - comment: |-
        This variable was calculated for the profiles where the categorization
        data has diagnosed that liquid water is present. The cloud droplet
        effective radius is calculated using the method 2 of Frisch et al.
        (2002), relating Z with effective radius by assuming a lognormal size
        distribution and its width. The number concentration required to
        represent the size distribution is derived by scaling the LWP measured
        with microwave radiometer over the observed (single) cloud layer.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Droplet effective radius (scaled to LWP)
      name: der_scaled
      standard_name: effective_radius_of_cloud_liquid_water_particles
      units: m
    - comment: |-
        This variable is an estimate of the random error in scaled effective
        radius assuming an error in Z of dZ = 2.0 dBZ, in the spectral
        width of dsigma_x = 0.1, and in the LWP of dQ = 0.005 kg m-2.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Absolute error in droplet effective radius (scaled to LWP)
      name: der_scaled_error
      standard_name: null
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
  description: |-
    Liquid droplet effective radius is derived using the
            method of Frisch et al. (2002), based on the attenuation-corrected
            radar reflectivity and liquid water path.
  dimensions:
    - comment: null
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Height above mean sea level
      name: height
      standard_name: height_above_mean_sea_level
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
