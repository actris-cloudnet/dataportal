lwc:
  common_variables:
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
    - comment: |-
        This variable was calculated for the profiles where the categorization data
        has diagnosed that liquid water is present and liquid water path is
        available from a coincident microwave radiometer. The model temperature and
        pressure were used to estimate the theoretical adiabatic liquid water
        content gradient for each cloud base and the adiabatic liquid water
        content is then scaled that its integral matches the radiometer measurement
        so that the liquid water content now follows a quasi-adiabatic profile.
        If the liquid layer is detected by the lidar only, there is the potential
        for cloud top height to be underestimated and so if the adiabatic integrated
        liquid water content is less than that measured by the microwave radiometer,
        the cloud top is extended until the adiabatic integrated liquid water
        content agrees with the value measured by the microwave radiometer.
        Missing values indicate that either
        1) a liquid water layer was diagnosed but no microwave radiometer data was
           available,
        2) a liquid water layer was diagnosed but the microwave radiometer data was
           unreliable; this may be because a melting layer was present in the
           profile, or because the retrieved lwp was unphysical (values of zero
           are not uncommon for thin supercooled liquid layers)
        3) that rain is present in the profile and therefore, the vertical extent of
           liquid layers is difficult to ascertain.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Liquid water content
      name: lwc
      standard_name: mass_concentration_of_liquid_water_in_air
      units: kg m-3
    - comment: |-
        This variable is an estimate of the random error in liquid water content
        due to the uncertainty in the microwave radiometer liquid water path
        retrieval and the uncertainty in cloud base and/or cloud top height.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Random error in liquid water content, one standard deviation
      name: lwc_error
      standard_name: null
      units: dB
    - comment: |-
        This variable describes whether a retrieval was performed for each pixel,
        and its associated quality, in the form of 6 different classes. The classes
        are defined in the definition attribute. The most reliable retrieval is that
        when both radar and lidar detect the liquid layer, and microwave radiometer
        data is present, indicated by the value 1. The next most reliable is when
        microwave radiometer data is used to adjust the cloud depth when the radar
        does not detect the liquid layer, indicated by the value 2, with a value of
        3 indicating the cloud pixels that have been added at cloud top to avoid
        the profile becoming superadiabatic. A value of 4 indicates that microwave
        radiometer data were not available or not reliable (melting level present
        or unphysical values) but the liquid layers were well defined. If cloud top
        was not well defined then this is indicated by a value of 5. The full
        retrieval of liquid water content, which requires reliable liquid water
        path from the microwave radiometer, was only performed for classes 1-3.
        No attempt is made to retrieve liquid water content when rain is present;
        this is indicated by the value 6.
      definition:
        - description: No liquid water detected.
          label: Value 0
        - description: Reliable retrieval.
          label: Value 1
        - description: Adiabatic retrieval where cloud top has been adjusted to match
            liquid water path from microwave radiometer because layer is not detected
            by radar.
          label: Value 2
        - description: "Adiabatic retrieval: new cloud pixels where cloud top has been
            adjusted to match liquid water path from microwave radiometer because layer
            is not detected by radar."
          label: Value 3
        - description: "No retrieval: either no liquid water path is available or liquid
            water path is uncertain."
          label: Value 4
        - description: "No retrieval: liquid water layer detected only by the lidar and
            liquid water path is unavailable or uncertain: cloud top may be higher than
            diagnosed cloud top since lidar signal has been attenuated."
          label: Value 5
        - description: "Rain present: cloud extent is difficult to ascertain and liquid
            water path also uncertain."
          label: Value 6
      dimensions:
        - time
        - height
      dtype: int32
      long_name: Liquid water content retrieval status
      name: lwc_retrieval_status
      standard_name: null
      units: "1"
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Liquid water path
      name: lwp
      standard_name: atmosphere_cloud_liquid_water_content
      units: kg m-2
    - comment: |-
        This variable is a rough estimate of the one-standard-deviation
        error in liquid water path, calculated as a combination of
        a 20 g m-2 linear error and a 25 %
        fractional error.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Error in liquid water path
      name: lwp_error
      standard_name: null
      units: kg m-2
  description: |-
    Liquid water content is calculated using the so-called
            adiabatic-scaled method where microwave radiometer is used to constrain
            the theoretical liquid water content of observed liquid clouds.
  dimensions:
    - comment: null
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Height above mean sea level
      name: height
      standard_name: height_above_mean_sea_level
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Time UTC
      name: time
      standard_name: time
      units: hours since 2025-01-01 00:00:00 +00:00
  references_html:
    - "Albrecht, B. A., Fairall, C. W., Thomson, D. W., White, A. B., Snider, J. B.,\
      \ &amp; Schubert, W. H. (1990). Surface\u2010based remote sensing of the observed\
      \ and the Adiabatic liquid water content of stratocumulus clouds. <i>Geophysical\
      \ Research Letters</i>, <i>17</i>(1), 89\u201392. <a href=\"https://doi.org/10.1029/GL017i001p00089\"\
      >https://doi.org/10.1029/GL017i001p00089</a>"
