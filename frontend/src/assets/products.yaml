cod:
  common_variables:
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: |-
        This variable was calculated for the pixels where the categorization
        data has diagnosed that the radar echo is due to ice. Missing values
        indicate that ice was detected only by the lidar, or that the radar
        reflectivity was affected by uncorrected liquid, rain or melting
        attenuation.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Visible extinction coefficient of ice cloud
      name: extinction_ice
      standard_name: null
      units: m-1
    - comment: |-
        Random error in ice extinction, one standard deviation, expressed as
        10 log10(1 + relative error). The error of the ice water content
        retrieval (see the iwc product) is used, as the empirical
        reflectivity-temperature relation for extinction has a similar
        uncertainty. It includes the additional uncertainty of the liquid
        attenuation correction where applied.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Random error in ice extinction coefficient
      name: extinction_ice_error
      standard_name: null
      units: dB
    - comment: |-
        This variable was calculated for the pixels where the categorization
        data has diagnosed liquid droplets and a reliable liquid water path was
        available from a coincident microwave radiometer. Where the liquid
        layer was not detected by the radar, or the retrieved droplet
        effective radius was outside the range 2-50 um
        (e.g. due to drizzle), an assumed effective radius of 10 um
        was used. Missing values indicate that liquid water path was
        unavailable, unreliable or zero, or that rain was present in the
        profile.
        Note that the liquid water path is distributed over the detected
        liquid layers only. If liquid is present in layers not classified as
        droplets (e.g. mixed-phase cloud above the lidar-detected liquid
        base), the extinction of the detected layers is overestimated. Such
        profiles are flagged in the optical_depth_retrieval_status variable.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Visible extinction coefficient of liquid cloud
      name: extinction_liquid
      standard_name: null
      units: m-1
    - comment: |-
        Random error in liquid extinction, one standard deviation, expressed
        as 10 log10(1 + relative error). It combines the liquid water content
        error (liquid water path error and cloud boundary uncertainty, see the
        lwc product) with the droplet effective radius error from the Frisch
        method, or an assumed 40 % where the effective radius
        was assumed.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Random error in liquid extinction coefficient
      name: extinction_liquid_error
      standard_name: null
      units: dB
    - comment: null
      definition:
        - description: No cloud detected.
          label: Value 0
        - description: "Liquid: reliable retrieval with radar-based droplet effective
            radius."
          label: Value 1
        - description: "Liquid: droplet effective radius not retrieved from radar, assumed
            value used."
          label: Value 2
        - description: "Ice: reliable retrieval."
          label: Value 3
        - description: "Ice: retrieval performed with radar corrected for liquid, rain
            or melting attenuation."
          label: Value 4
        - description: "Mixed phase: both liquid and ice extinction retrieved in the same
            pixel."
          label: Value 5
        - description: "Cloud detected but no retrieval: rain, missing or non- positive
            liquid water path, ice detected only by lidar, or uncorrected radar attenuation."
          label: Value 6
      dimensions:
        - time
        - height
      dtype: int32
      long_name: Extinction coefficient retrieval status
      name: extinction_retrieval_status
      standard_name: null
      units: "1"
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Liquid water path
      name: lwp
      standard_name: atmosphere_cloud_liquid_water_content
      units: kg m-2
    - comment: |-
        This variable is a rough estimate of the one-standard-deviation
        error in liquid water path, calculated as a combination of
        a 20 g m-2 linear error and a 25 %
        fractional error.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Error in liquid water path
      name: lwp_error
      standard_name: null
      units: kg m-2
    - comment: |-
        Vertical integral of extinction over the profile. The value is zero
        in profiles where no cloud was detected. The retrieval is not
        performed, and the value is missing, if rain is present, if liquid
        cloud is present but liquid water path is unavailable or unreliable,
        or if ice is present but affected by uncorrected radar attenuation.
        Pixels where ice was detected only by the lidar do not contribute,
        so the value may be a lower bound; see the retrieval status.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Cloud optical depth
      name: optical_depth
      standard_name: atmosphere_optical_thickness_due_to_cloud
      units: "1"
    - comment: |-
        Random error in cloud optical depth, one standard deviation, expressed
        as 10 log10(1 + relative error). The extinction errors are assumed
        fully correlated within a profile for each phase, as they are
        dominated by the liquid water path, effective radius and
        reflectivity-temperature relation uncertainties, and independent
        between liquid and ice. Systematic errors, such as liquid in layers
        not classified as droplets or ice detected only by the lidar, are
        not included; see the retrieval status.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Random error in cloud optical depth
      name: optical_depth_error
      standard_name: null
      units: dB
    - comment: |-
        Vertical integral of extinction over the profile. The value is zero
        in profiles where no cloud was detected. The retrieval is not
        performed, and the value is missing, if rain is present, if liquid
        cloud is present but liquid water path is unavailable or unreliable,
        or if ice is present but affected by uncorrected radar attenuation.
        Pixels where ice was detected only by the lidar do not contribute,
        so the value may be a lower bound; see the retrieval status.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Ice cloud optical depth
      name: optical_depth_ice
      standard_name: null
      units: "1"
    - comment: |-
        Vertical integral of extinction over the profile. The value is zero
        in profiles where no cloud was detected. The retrieval is not
        performed, and the value is missing, if rain is present, if liquid
        cloud is present but liquid water path is unavailable or unreliable,
        or if ice is present but affected by uncorrected radar attenuation.
        Pixels where ice was detected only by the lidar do not contribute,
        so the value may be a lower bound; see the retrieval status.
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Liquid cloud optical depth
      name: optical_depth_liquid
      standard_name: null
      units: "1"
    - comment: null
      definition:
        - description: "Clear sky: no cloud detected, optical depth is zero."
          label: Value 0
        - description: Reliable retrieval.
          label: Value 1
        - description: Assumed droplet effective radius used where the radar-based retrieval
            was unavailable or outside the valid range.
          label: Value 2
        - description: "Ice detected only by lidar in part of the profile: ice optical
            depth is a lower bound."
          label: Value 3
        - description: "Liquid water path exceeds the adiabatic liquid water path of the
            detected liquid layers by more than a factor of two: liquid is probably present
            in layers not classified as droplets, and the vertical distribution of liquid
            extinction is unreliable."
          label: Value 4
        - description: "No retrieval: rain, missing or unreliable liquid water path, or
            uncorrected radar attenuation in ice."
          label: Value 5
      dimensions:
        - time
      dtype: int32
      long_name: Cloud optical depth retrieval status
      name: optical_depth_retrieval_status
      standard_name: null
      units: "1"
  description: "Cloud optical depth (\U0001D70F) is the vertical integral of the\n\
    \        visible extinction coefficient (\U0001D6FC) of liquid and ice clouds.\
    \ Liquid\n        extinction is derived from the adiabatic-scaled liquid water\
    \ content\n        and the LWP-scaled droplet effective radius of Frisch et al.\
    \ (2002),\n        and ice extinction from the ice water content and ice effective\
    \ radius\n        retrieved with the Hogan et al. (2006) reflectivity-temperature\n\
    \        relations."
  dimensions:
    - comment: null
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Height above mean sea level
      name: height
      standard_name: height_above_mean_sea_level
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Time UTC
      name: time
      standard_name: time
      units: hours since 2026-09-01 00:00:00 +00:00
  references_html:
    - "Frisch, S., Shupe, M., Djalalova, I., Feingold, G., &amp; Poellot, M. (2002).\
      \ The Retrieval of Stratus Cloud Droplet Effective Radius with Cloud Radars. <i>J.\
      \ Atmos. Oceanic Technol.</i>, <i>19</i>(6), 835\u2013842. <a href=\"https://doi.org/10.1175/1520-0426(2002)019%3C0835:TROSCD%3E2.0.CO;2\"\
      >https://doi.org/10.1175/1520-0426(2002)019%3C0835:TROSCD%3E2.0.CO;2</a>"
    - "Hogan, R. J., Mittermaier, M. P., &amp; Illingworth, A. J. (2006). The Retrieval\
      \ of Ice Water Content from Radar Reflectivity Factor and Temperature and Its\
      \ Use in Evaluating a Mesoscale Model. <i>Journal of Applied Meteorology and Climatology</i>,\
      \ <i>45</i>(2), 301\u2013317. <a href=\"https://doi.org/10.1175/JAM2340.1\">https://doi.org/10.1175/JAM2340.1</a>"
    - "Delano\xEB, J., Protat, A., Bouniol, D., Heymsfield, A., Bansemer, A., &amp;\
      \ Brown, P. (2007). The Characterization of Ice Cloud Properties from Doppler\
      \ Radar Measurements. <i>Journal of Applied Meteorology and Climatology</i>, <i>46</i>(10),\
      \ 1682\u20131698. <a href=\"https://doi.org/10.1175/JAM2543.1\">https://doi.org/10.1175/JAM2543.1</a>"
    - "Griesche, H. J., Seifert, P., Ansmann, A., Baars, H., Barrientos Velasco, C.,\
      \ B\xFChl, J., Engelmann, R., Radenz, M., Zhenping, Y., &amp; Macke, A. (2020).\
      \ Application of the shipborne remote sensing supersite OCEANET for profiling\
      \ of Arctic aerosols and clouds during <em>Polarstern</em> cruise PS106. <i>Atmos.\
      \ Meas. Tech.</i>, <i>13</i>(10), 5335\u20135358. <a href=\"https://doi.org/10.5194/amt-13-5335-2020\"\
      >https://doi.org/10.5194/amt-13-5335-2020</a>"
  specific_variables: []
