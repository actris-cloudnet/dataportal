      \ href=\"https://doi.org/10.1175/1520-0450(2000)039&lt;0169:GBRSOS&gt;2.0.CO;2\"\
      >https://doi.org/10.1175/1520-0450(2000)039&lt;0169:GBRSOS&gt;2.0.CO;2</a>"
    - "Brenguier, J. L. (1991). Parameterization of the Condensation Process: A Theoretical\
      \ Approach. <i>J. Atmos. Sci.</i>, <i>48</i>(2), 264\u2013282. <a href=\"https://doi.org/10.1175/1520-0469(1991)048&lt;0264:POTCPA&gt;2.0.CO;2\"\
      >https://doi.org/10.1175/1520-0469(1991)048&lt;0264:POTCPA&gt;2.0.CO;2</a>"
  specific_variables: []
