      \ B\xFChl, J., Engelmann, R., Radenz, M., Zhenping, Y., &amp; Macke, A. (2020).\
      \ Application of the shipborne remote sensing supersite OCEANET for profiling\
      \ of Arctic aerosols and clouds during <em>Polarstern</em> cruise PS106. <i>Atmos.\
