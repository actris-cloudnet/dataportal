iwc:
  common_variables:
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: |-
        This variable was calculated from the 34.89-GHz radar reflectivity
        factor after correction for gaseous attenuation, and temperature taken from
        a forecast model, using the following empirical formula:
        log10(iwc[g m-3]) = 0.000242Z[dBZ]T[degC] + 0.0699Z[dBZ]
        + -0.0186T[degC] + -1.63. In this formula Z is taken to be
        defined such that all frequencies of radar would measure the same Z in
        Rayleigh scattering ice. However, the radar is more likely to have been
        calibrated such that all frequencies would measure the same Z in Rayleigh
        scattering liquid cloud at 0 degrees C. The measured Z is therefore
        multiplied by |K(liquid,0degC,34.89GHz)|^2/0.93 = 0.944 before applying
        this formula. The formula has been used where the "categorization" data has
        diagnosed that the radar echo is due to ice, but note that in some cases
        supercooled drizzle will erroneously be identified as ice. Missing data
        indicates either that ice cloud was present but it was only detected by
        the lidar so its ice water content could not be estimated, or that there
        was rain below the ice associated with uncertain attenuation of the
        reflectivities in the ice. Note that where microwave radiometer liquid water
        path was available it was used to correct the radar for liquid attenuation
        when liquid cloud occurred below the ice; this is indicated a value of 3
        in the iwc_retrieval_status variable. There is some uncertainty in this
        procedure which is reflected by an increase in the associated values
        in the iwc_error variable. When microwave radiometer data were not available
        and liquid cloud occurred below the ice, the retrieval was still performed
        but its reliability is questionable due to the uncorrected liquid water
        attenuation. This is indicated by a value of 2 in the iwc_retrieval_status
        variable, and an increase in the value of the iwc_error variable.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Ice water content
      name: iwc
      standard_name: null
      units: kg m-3
    - comment: "This variable is an estimate of the possible systematic error in \n\
        ice water content due to the calibration error of the radar \nreflectivity factor\
        \ from which it was calculated."
      definition: null
      dimensions: []
      dtype: float32
      long_name: Possible bias in ice water content
      name: iwc_bias
      standard_name: null
      units: dB
    - comment: |-
        This variable is an estimate of the one-standard-deviation random
        error in ice water content due to both the uncertainty of the retrieval
        (about 1.7 dB), and the random error in radar reflectivity
        factor from which ice water content was calculated. When liquid water is
        present beneath the ice but no microwave radiometer data were available to
        correct for the associated attenuation, the error also includes a
        contribution equivalent to approximately 250 g m-2 of liquid water
        path being uncorrected for.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Random error in ice water content
      name: iwc_error
      standard_name: null
      units: dB
    - comment: |-
        This variable describes whether a retrieval was performed
        for each pixel, and its associated quality.
      definition:
        - description: No ice present.
          label: Value 0
        - description: Reliable retrieval.
          label: Value 1
        - description: Unreliable retrieval due to uncorrected liquid, rain or melting
            attenuation.
          label: Value 2
        - description: Retrieval performed with radar corrected for liquid, rain and melting
            attenuation.
          label: Value 3
        - description: Ice detected only by the lidar.
          label: Value 4
        - description: Uncorrected rain attenuation (deprecated).
          label: Value 5
        - description: "Clear sky above rain and wet-bulb temperature less than 0degC:
            if rain attenuation is strong, ice could be present but undetected."
          label: Value 6
        - description: "Drizzle or rain that would have been classified as ice if the
            wet-bulb temperature were less than 0degC: may be ice if temperature is in
            error."
          label: Value 7
      dimensions:
        - time
        - height
      dtype: int32
      long_name: Ice water content retrieval status
      name: iwc_retrieval_status
      standard_name: null
      units: "1"
    - comment: |-
        This variable is an estimate of the minimum detectable ice water
        content as a function of height.
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Minimum detectable ice water content
      name: iwc_sensitivity
      standard_name: null
      units: kg m-3
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
  description: |-
    Ice water content is calculated using the so-called Z-T
            method based on the attenuated-corrected radar reflectivity and model
            temperature.
  dimensions:
    - comment: null
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Height above mean sea level
      name: height
      standard_name: height_above_mean_sea_level
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Time UTC
      name: time
      standard_name: time
      units: hours since 2025-01-01 00:00:00 +00:00
