      >https://doi.org/10.5194/amt-13-5335-2020</a>"
    - "Borque, P., Luke, E., &amp; Kollias, P. (2016). On the unified estimation of\
      \ turbulence eddy dissipation rate using Doppler cloud radars and lidars. <i>JGR\
      \ Atmospheres</i>, <i>121</i>(10), 5972\u20135989. <a href=\"https://doi.org/10.1002/2015JD024543\"\
      >https://doi.org/10.1002/2015JD024543</a>"
  specific_variables: []
ier:
  common_variables:
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Altitude of site
      name: altitude
      standard_name: altitude
      units: m
    - comment: |-
        This variable was calculated from the 34.89-GHz radar
        reflectivity factor after correction for gaseous attenuation,
        and temperature taken from a forecast model, using the following
        empirical formula: log10(ier[m]) = (-0.000205 * Z[dBZ] * T[degC]
        + 0.0016 * Z[dBZ] + -0.0015 * T[degC] + -1.52)
        * 3 / (2 * 917[kg/m3]). In this formula Z is taken
        to be defined such that all frequencies of radar would measure the
        same Z in Rayleigh scattering ice. However, the radar is more likely
        to have been calibrated such that all frequencies would measure
        the same Z in Rayleigh scattering liquid cloud at 0 degrees C.
        The measured Z is therefore multiplied by
         |K(liquid,0degC,34.89GHz)|^2/0.93 = 0.944 before applying
        this formula. The formula has been used where the "categorization"
        "data has diagnosed that the radar echo is due to ice, but note
        that in some cases supercooled drizzle will erroneously be identified
        as ice. Missing data indicates either that ice cloud was present but it was
        only detected by the lidar so its ice water content could not be estimated.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Ice effective radius
      name: ier
      standard_name: null
      units: m
    - comment: |-
        Error in effective radius of ice particles due to error propagation,
        of ier = 3/(2 rho_i) IWC / alpha, using error for IWC and alpha as
        given in Hogan 2006.
      definition: null
      dimensions:
        - time
        - height
      dtype: float32
      long_name: Random error in ice effective radius
      name: ier_error
      standard_name: null
      units: m
    - comment: |-
        This variable describes whether a retrieval was performed
        for each pixel, and its associated quality.
      definition:
        - description: No ice present.
          label: Value 0
        - description: Reliable retrieval.
          label: Value 1
        - description: Unreliable retrieval due to uncorrected liquid, rain or melting
            attenuation.
          label: Value 2
        - description: Retrieval performed with radar corrected for liquid, rain and melting
            attenuation.
          label: Value 3
        - description: Ice detected only by the lidar.
          label: Value 4
        - description: Uncorrected rain attenuation (deprecated).
          label: Value 5
        - description: "Clear sky above rain and wet-bulb temperature less than 0degC:
            if rain attenuation is strong, ice could be present but undetected."
          label: Value 6
        - description: "Drizzle or rain that would have been classified as ice if the
            wet-bulb temperature were less than 0degC: may be ice if temperature is in
            error."
          label: Value 7
      dimensions:
        - time
        - height
      dtype: int32
      long_name: Ice effective radius retrieval status
      name: ier_retrieval_status
      standard_name: null
      units: "1"
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Latitude of site
      name: latitude
      standard_name: latitude
      units: degree_north
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Longitude of site
      name: longitude
      standard_name: longitude
      units: degree_east
  description: "The ice particle effective radius is derived from\n        attenuation-corrected\
    \ radar reflectivity and model temperature using\n        the method of Grieche\
    \ et al. (2020), which incorporates the approach of\n        Hogan et al. (2006)\
    \ to estimate ice water content and uses the\n        parameterization of alpha\
    \ from Delano\xEB et al. (2007)."
  dimensions:
    - comment: null
      definition: null
      dimensions:
        - height
      dtype: float32
      long_name: Height above mean sea level
      name: height
      standard_name: height_above_mean_sea_level
      units: m
    - comment: null
      definition: null
      dimensions:
        - time
      dtype: float32
      long_name: Time UTC
      name: time
      standard_name: time
      units: hours since 2025-01-01 00:00:00 +00:00
  references_html:
    - "Hogan, R. J., Mittermaier, M. P., &amp; Illingworth, A. J. (2006). The Retrieval\
      \ of Ice Water Content from Radar Reflectivity Factor and Temperature and Its\
      \ Use in Evaluating a Mesoscale Model. <i>Journal of Applied Meteorology and Climatology</i>,\
      \ <i>45</i>(2), 301\u2013317. <a href=\"https://doi.org/10.1175/JAM2340.1\">https://doi.org/10.1175/JAM2340.1</a>"
    - "Delano\xEB, J., Protat, A., Bouniol, D., Heymsfield, A., Bansemer, A., &amp;\
      \ Brown, P. (2007). The Characterization of Ice Cloud Properties from Doppler\
      \ Radar Measurements. <i>Journal of Applied Meteorology and Climatology</i>, <i>46</i>(10),\
